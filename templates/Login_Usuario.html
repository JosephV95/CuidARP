<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuidARP ENFERMERÍA - Iniciar Sesión</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        forest: {
                            900: '#071D17',
                            800: '#0B2B22',
                            700: '#123D31',
                            600: '#1D4F41',
                            500: '#2A6B58',
                            100: '#E6F2ED',
                            50: '#F0F7F4',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F3F5F4;
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gray-200/80 overflow-hidden">
        
        <!-- Header del Login -->
        <div class="bg-cyan-950 text-white p-8 text-center relative">
            <div class="w-14 h-14 bg-emerald-600 rounded-2xl flex items-center justify-center text-white font-bold text-2xl mx-auto mb-3 shadow-inner">
                <i class="fa-solid fa-plus"></i>
            </div>
            <h1 class="font-bold text-2xl tracking-wide">CuidARP</h1>
            <p class="text-xs text-emerald-200/80 uppercase tracking-widest mt-1">Gestión de Enfermería - Hospital Dr. Carlos Pereyra</p>
        </div>

        <!-- Formulario de Login -->
        <form action="{% url 'home' %}" method="POST" class="p-8 space-y-5">
            <!-- {% csrf_token %} <-- Descomentar al usar autenticación real de Django -->

            <!-- Correo o DNI -->
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Correo Electrónico o DNI *</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-solid fa-user text-xs"></i>
                    </span>
                    <input type="text" name="username" required placeholder="Ej: s.medina@hospitalpereyra.gob.ar" 
                           class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-forest-800 focus:outline-none">
                </div>
            </div>

            <!-- Contraseña -->
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">Contraseña *</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                        <i class="fa-solid fa-lock text-xs"></i>
                    </span>
                    <input type="password" name="password" required placeholder="••••••••" 
                           class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-300 rounded-xl text-xs focus:ring-2 focus:ring-forest-800 focus:outline-none">
                </div>
            </div>

            <!-- Botón de Ingreso -->
            <div class="pt-2">
                <button type="submit" class="w-full py-3 bg-sky-900 hover:bg-sky-700 text-white font-bold text-xs rounded-xl shadow-md transition-all flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Iniciar Sesión en el Sistema</span>
                </button>
            </div>

            <!-- Enlace para registrarse -->
            <div class="text-center pt-3 border-t border-gray-100">
                <p class="text-xs text-gray-500">¿No tienes una cuenta registrada? 
                    <a href="{% url 'registro_usuario' %}" class="font-bold text-blue-800 hover:underline">Registrarse aquí</a>
                </p>
            </div>
        </form>
    </div>

</body>
</html>
